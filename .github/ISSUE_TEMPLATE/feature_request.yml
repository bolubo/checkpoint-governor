name: Feature request
description: Propose a user-facing capability or design change
labels: ["kind/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the real workflow and who encounters it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: implementation_intent
    attributes:
      label: Are you planning to implement this?
      description: This helps maintainers scope the issue and avoid asking twice.
      options:
        - "Yes — I plan to submit a PR"
        - "Maybe — I can help with guidance"
        - "No — I am proposing the problem only"
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This changes what the product decides.
        - label: This changes how a decision is carried out — the write, the gate, the window.
        - label: This is specific to the Kubernetes/controller path.
        - label: This is a condition, a probe, or a reporting surface.
        - label: This is documentation or developer tooling only.
