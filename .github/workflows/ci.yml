# The gate. One required check, and it does only the work the diff justifies.
#
# Why it is shaped this way — the two failures that made "always red" and the three minutes per change —
# is written down in docs/ci.md. The short version:
#
#   docs only        ~15s   the docs pins
#   Go or tests     ~60s    format, vet, build, every unit test
#   behaviour       ~3min   + e2e, exp, demo, install-smoke, spot, resume, py, drill
#   Dockerfile      +40s    + docker build
#   tag             release.yml, not here
#   manual          everything
#
# The classification is a shell step, not a third-party path filter: the gate should not have a supply
# chain we have not read. Every skipped step prints why, so "green because nothing ran" is visible.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The heavy gate is manual, never scheduled: this repository does not create cron jobs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push to the same branch cancels the first: the older run would test a tree nobody will merge.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: what changed
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          code=false; docs=false; image=false
          case "$EVENT" in
            workflow_dispatch) code=true; docs=true; image=true ;;
            pull_request) files=$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate --jq '.[].filename') ;;
            push) files=$(gh api "repos/$REPO/commits/$SHA" --jq '.files[]?.filename') ;;
            *) files="" ;;
          esac
          # A commit the API will not describe (a merge commit, a force push) is treated as a code change:
          # running too much is a slower answer, running too little is a wrong one.
          if [ -z "$files" ]; then
            echo "the API returned no file list; treating the tree as changed"
            files=$(git ls-files)
          fi
          for f in $files; do
            case "$f" in
              *.md|docs/*) docs=true ;;
              Dockerfile|deploy/*) image=true; code=true ;;
              *) code=true ;;
            esac
          done
          if [ "$code" = "false" ] && [ "$docs" = "true" ]; then
            echo "changing docs only; the integration steps are skipped"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf 'changed: %s\n' "$(printf '%s' "$files" | tr '\n' ' ' | cut -c1-200)"

      # A documentation-only change compiles one package and runs two tests; it does not pay for the
      # build and the whole suite. ~35s, measured.
      - name: make docs
        if: steps.scope.outputs.code == 'false'
        run: make docs

      # Format, vet, build, every unit test. ~110s on a two-core runner.
      - name: make fast
        if: steps.scope.outputs.code == 'true'
        run: make fast

      # The gate module has its own go.mod (client-go stays out of the core). Build and test it here
      # too, or a change to contrib/gate could merge without the suite ever seeing it.
      - name: make gate
        if: steps.scope.outputs.code == 'true'
        run: make gate

      # The shipped binary, driven the way a user drives it: no cluster, half a second.
      - name: make e2e
        if: steps.scope.outputs.code == 'true'
        run: make e2e

      # Decisions in milliseconds, writes in seconds: the D and X layers.
      - name: make exp
        if: steps.scope.outputs.code == 'true'
        run: make exp

      # The three acts (now four) and the receipts they print.
      - name: make demo
        if: steps.scope.outputs.code == 'true'
        run: make demo

      # The install line a user runs, proven offline: dist, checksum, tarball, binary on PATH.
      - name: make install-smoke
        if: steps.scope.outputs.code == 'true'
        run: make install-smoke

      # The fault the product exists for, ending in a receipt: one write, then may-exit.
      - name: make spot
        if: steps.scope.outputs.code == 'true'
        run: make spot

      # Can a restore be judged, and did the job adopt one: six sentences and one tally.
      - name: make resume
        if: steps.scope.outputs.code == 'true'
        run: make resume

      # The training loop's half, standard library only (no torch on the runner).
      - name: make py
        if: steps.scope.outputs.code == 'true'
        run: make py

      # The only check that earns `restorable`, and the refusal when a drill changes the evidence.
      - name: make drill
        if: steps.scope.outputs.code == 'true'
        run: make drill

      # The shortest path has to keep working, or the README is fiction. Only when the image can change.
      - name: docker build
        if: steps.scope.outputs.image == 'true'
        run: docker build -t governor .
