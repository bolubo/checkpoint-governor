# The whole claim, on every push: the tests, the experiments, the demo, and the image.
#
# There is no matrix and no caching theatre. The suite takes about a minute, and a controller that
# says what it did should be able to show it did it.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # build, vet, the whole test suite
      - name: make check
        run: make check

      # the shipped binary, driven the way a user drives it — no cluster, half a second
      - name: make e2e
        run: make e2e

      # decisions in milliseconds, writes in seconds: the D and X layers
      - name: make exp
        run: make exp

      # the three acts, and the receipts they print
      - name: make demo
        run: make demo

      # the install line a user runs, proven offline: dist, checksum, tarball, binary on PATH
      - name: make install-smoke
        run: make install-smoke

      # the fault the product exists for, ending in a receipt: one write, then may-exit
      - name: make spot
        run: make spot

      # can a restore be judged, and did the job adopt one: six sentences and one tally
      - name: make resume
        run: make resume

      # the training loop's half, with the standard library only (no torch on the runner)
      - name: make py
        run: make py

      # the only check that earns `restorable`, and the refusal when a drill changes the evidence
      - name: make drill
        run: make drill

      # the shortest path has to keep working, or the README is fiction
      - name: docker build
        run: docker build -t governor .
