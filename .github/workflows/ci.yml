# The whole claim, on every push: the tests, the experiments, the demo, and the image.
#
# There is no matrix and no caching theatre. The suite takes about a minute, and a controller that
# says what it did should be able to show it did it.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # build, vet, the whole test suite
      - name: make check
        run: make check

      # the shipped binary, driven the way a user drives it — no cluster, half a second
      - name: make e2e
        run: make e2e

      # decisions in milliseconds, writes in seconds: the D and X layers
      - name: make exp
        run: make exp

      # the three acts, and the receipts they print
      - name: make demo
        run: make demo

      # the shortest path has to keep working, or the README is fiction
      - name: docker build
        run: docker build -t governor .
