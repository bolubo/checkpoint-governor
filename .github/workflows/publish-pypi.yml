# `pip install ckpt-policy` is the whole Python install, so the package leaves from a workflow, where
# the engine is already built, rather than from a laptop. PyPI verifies this file through trusted
# publishing (`id-token`), so no long-lived token sits on any machine.
#
# One tag publishes both artifacts: `release.yml` builds the binaries and the image, this file builds
# the wheel, both from the tree the tag points at, and the two numbers agree (decision 0029).
# `workflow_dispatch` exists for the first upload, because v0.21.0 was tagged before this file did.
name: publish-pypi

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # trusted publishing: this is the credential

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same script a laptop runs. It fails when the wheel does not contain the engine, so a
      # client that would download a binary at first use cannot be published by accident.
      - name: build the wheel
        run: sh hack/build-wheel.sh

      - name: say what is about to be published
        run: |
          ls -l dist/wheels/*.whl
          python3 - <<'PY'
          import glob, zipfile
          w = sorted(glob.glob("dist/wheels/*.whl"))[-1]
          with zipfile.ZipFile(w) as z:
              meta = z.read([n for n in z.namelist() if n.endswith("METADATA")][0]).decode()
          print(w)
          print("\n".join(meta.splitlines()[:5]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ckpt-policy-wheel
          path: dist/wheels/*.whl

  publish:
    needs: wheel
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ckpt-policy-wheel
          path: dist/wheels

      # One artifact, one version. Two wheels in the directory would be two uploads, and the second
      # would either fail or publish something nobody asked for.
      - name: exactly one wheel
        run: |
          count=$(ls dist/wheels/*.whl 2>/dev/null | wc -l)
          if [ "$count" != "1" ]; then
            echo "expected one wheel, found $count" >&2
            ls -l dist/wheels >&2 || true
            exit 1
          fi

      # A tag that disagrees with the wheel is how one version gets published under another version's
      # name, and PyPI never lets that be undone.
      - name: the tag and the wheel must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/wheels/*.whl | head -1)
          got=$(basename "$wheel" | sed -E 's/.*ckpt_policy-([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/')
          if [ "$want" != "$got" ]; then
            echo "tag says $want, wheel says $got" >&2
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
