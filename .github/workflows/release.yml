# A tag produces what a user downloads: two statically linked binaries, their checksums, and a
# multi-arch image. It is the only workflow that runs on a tag; the pull-request gate stays in ci.yml,
# so a tag does not spend a second full test run.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the release notes and the checksum files
  packages: write   # ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The binaries and the checksums are built before the image, so a failure in the cheap half
      # stops the run before anything is pushed.
      - name: make dist
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      # The notes are the CHANGELOG section for this tag, so the release and the repository say the
      # same thing. A tag with no section falls back to generated notes rather than publishing an
      # empty page.
      - name: release notes from the changelog
        run: |
          sh hack/release-notes.sh "${GITHUB_REF_NAME}" > /tmp/notes.md || true

      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/notes.md ]; then
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --notes-file /tmp/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --generate-notes
          fi
