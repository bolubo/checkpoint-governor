# c1: one higher-priority arrival that cannot fit. 2500m is used of 4000m; this asks for 2000m.
# Kueue has to free 500m, which is exactly one holder.
apiVersion: batch/v1
kind: Job
metadata:
  name: arrival
  namespace: default
  labels: {kueue.x-k8s.io/queue-name: lab}
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      priorityClassName: lab-high
      restartPolicy: Never
      containers:
        - name: arrival
          image: busybox:1.36
          command: ["sh", "-c", "sleep 600"]
          resources:
            requests: {cpu: "2000m", memory: "64Mi"}
