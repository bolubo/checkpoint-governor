# The arrival, with the three things a case varies. sweep.sh substitutes them.
apiVersion: batch/v1
kind: Job
metadata:
  name: arrival
  namespace: default
  labels: {kueue.x-k8s.io/queue-name: __QUEUE__}
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      priorityClassName: __PRIORITY__
      restartPolicy: Never
      containers:
        - name: arrival
          image: busybox:1.36
          command: ["sh", "-c", "sleep 300"]
          resources:
            requests: {cpu: "__CPU__", memory: "64Mi"}
