# c5: the same arrival, into a queue that may not preempt. Nothing is taken, and the arrival waits.
#
# This is the case that decides whether our predictor is allowed to fire on "a higher priority is
# waiting" alone. If nothing is preempted here and our rule fires, the rule is wrong by construction.
apiVersion: batch/v1
kind: Job
metadata:
  name: arrival
  namespace: default
  labels: {kueue.x-k8s.io/queue-name: lab-np}
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      priorityClassName: lab-high
      restartPolicy: Never
      containers:
        - name: arrival
          image: busybox:1.36
          command: ["sh", "-c", "sleep 600"]
          resources:
            requests: {cpu: "2000m", memory: "64Mi"}
