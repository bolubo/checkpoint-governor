apiVersion: batch/v1
kind: Job
metadata:
  name: arrival-direct
  namespace: default
  labels: {kueue.x-k8s.io/queue-name: lab}
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      priorityClassName: lab-high
      restartPolicy: Never
      containers:
        - name: arrival-direct
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 120"]
          resources:
            requests: {cpu: "2000m", memory: "64Mi"}
